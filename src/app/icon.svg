<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20">
  <style>
    .ink { stroke: #2a2420; fill: none; }
    .fill { fill: #2a2420; }
    .accent { fill: #1f4fd1; }
    @media (prefers-color-scheme: dark) {
      .ink { stroke: #ede7dd; }
      .fill { fill: #ede7dd; }
      .accent { fill: #7ea2f5; }
    }
  </style>
  <rect class="ink" x="1" y="1" width="18" height="18" rx="3.5" stroke-width="1.5" />
  <rect class="fill" x="5" y="5" width="4" height="4" rx="1" />
  <rect class="ink" x="11.25" y="5.25" width="3.5" height="3.5" rx="0.75" stroke-width="1" />
  <rect class="ink" x="5.25" y="11.25" width="3.5" height="3.5" rx="0.75" stroke-width="1" />
  <rect class="accent" x="11" y="11" width="4" height="4" rx="1" />
</svg>
